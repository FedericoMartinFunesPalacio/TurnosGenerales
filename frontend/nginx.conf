# =============================================
# Nginx Configuration — Frontend
# =============================================
#
# This config does two things:
#   1. Serves the Angular SPA (static files)
#   2. Proxies API and upload requests to the backend
#
# In Docker, "backend_ts" resolves to the backend
# container's IP via the bridge network.
# =============================================

server {
    listen 80;
    server_name localhost;

    # Angular app root — serves index.html and all static assets
    root /usr/share/nginx/html;

    # -------------------------------------------
    # SPA Routing
    # -------------------------------------------
    # Angular uses client-side routing. Without this,
    # refreshing on /consumidor would return 404.
    # try_files falls back to index.html so Angular
    # can handle the route.
    # -------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------
    # API Proxy
    # -------------------------------------------
    # All requests to /api/* are forwarded to the
    # backend_ts container on port 3000.
    # The browser sees everything as same-origin.
    # -------------------------------------------
    location /api/ {
        proxy_pass http://backend_ts:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------
    # Uploads Proxy
    # -------------------------------------------
    # User-uploaded documents (turno attachments)
    # are served from the backend's /uploads/ route.
    # -------------------------------------------
    location /uploads/ {
        proxy_pass http://backend_ts:3000;
        proxy_set_header Host $host;
    }
}
