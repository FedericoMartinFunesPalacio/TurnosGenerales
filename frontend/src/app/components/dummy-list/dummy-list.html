<div class="dummy-list">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z1 w-full" *ngIf="dataSource && dataSource.length > 0; else empty">

    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let d"> {{ d.id }} </td>
    </ng-container>

    <!-- Nombre Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let d"> {{ d.name }} </td>
    </ng-container>

    <!-- Descripción Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Descripción </th>
      <td mat-cell *matCellDef="let d"> {{ d.description }} </td>
    </ng-container>

    <!-- Serial Column -->
    <ng-container matColumnDef="serialNumber">
      <th mat-header-cell *matHeaderCellDef> Serial </th>
      <td mat-cell *matCellDef="let d"> {{ d.serialNumber }} </td>
    </ng-container>

    <!-- Creado Column -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef> Creado </th>
      <td mat-cell *matCellDef="let d"> {{ d.createdAt | date:'short' }} </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let d">
        <button mat-button color="primary" (click)="onEdit(d)">Editar</button>
        <button mat-button color="warn" (click)="onRemove(d)">Borrar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <ng-template #empty>
    <div class="text-center p-4">No hay dummies</div>
  </ng-template>
</div>
