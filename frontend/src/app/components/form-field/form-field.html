<div class="field">
  @if (label) {
    <label>{{ label }}</label>
  }
  <input
    [type]="type"
    [placeholder]="placeholder"
    [formControl]="formControl" />
  @if (hint) {
    <span class="hint">{{ hint }}</span>
  }
  @if (control?.invalid && control?.touched) {
    <span class="error">
      <ng-content select="[error]"></ng-content>
    </span>
  }
</div>
