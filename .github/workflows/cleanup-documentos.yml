# Limpieza diaria de documentos huérfanos en Supabase Storage
#
# Qué hace: llama al endpoint POST /api/v1/upload/cleanup del backend.
# El backend lista el bucket "documentos" y borra los archivos que:
#   - NO los referencia ningún turno en la DB, y
#   - tienen más de 24 horas de creados (margen para no pisar subidas en vuelo)
#
# Los archivos "referenciados" (asociados a turnos existentes) NUNCA se tocan.
# Esta limpieza es una red de seguridad: el día a día ya borra documentos
# al re-subir uno nuevo o al eliminar un turno (borrado síncrono).
#
# Es gratis: corre en GitHub Actions (1 ejecución/día ≈ 30 min de Actions al mes).
# manual: pestaña Actions -> "Cleanup documentos" -> Run workflow
name: Cleanup documentos

on:
  schedule:
    - cron: "0 4 * * *" # todos los días 04:00 UTC = 01:00 (Argentina, UTC-3)
  workflow_dispatch: # permite dispararlo a mano desde la pestaña Actions

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar cleanup en el backend
        env:
          BE_URL: https://turnosgeneralesbe.onrender.com
          CLEANUP_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
        run: |
          # El servicio gratis de Render duerme a los 15 min sin tráfico:
          # --retry + --retry-all-errors esperan el cold start (~1 min)
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 30 --retry-all-errors --max-time 180 \
            -X POST "$BE_URL/api/v1/upload/cleanup?token=$CLEANUP_TOKEN&horas=24"
