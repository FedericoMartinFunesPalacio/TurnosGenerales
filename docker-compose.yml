# =============================================
# Docker Compose — Turnos Generales (dev local)
# =============================================
#
# Servicios:
#   - postgres:     Base de datos PostgreSQL (datos persistidos en un volume)
#   - backend_ts:   API Node/Express (puerto 3000) — aplica migraciones al arrancar
#   - frontend:     Angular via Nginx (puerto 80)
#
# Uso:
#   docker compose up --build
#
# Los datos de la DB persisten en el volume `postgres-data`.
# Para resetear la DB: docker compose down -v (borra los volumes)
# =============================================

services:

  # -------------------------------------------
  # PostgreSQL — Base de datos
  # -------------------------------------------
  # Los datos viven en el volume `postgres-data`, asi sobreviven
  # a `docker compose down` (solo se borran con `down -v`).
  # -------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos
      POSTGRES_DB: turnosdb
    ports:
      # Expuesto en el host para correr prisma CLI / studio desde la maquina
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnosdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  # -------------------------------------------
  # Backend TypeScript (Express + Prisma)
  # -------------------------------------------
  # Al arrancar ejecuta `prisma migrate deploy` (aplica migraciones
  # pendientes) y despues levanta el server con node dist/index.js.
  # -------------------------------------------
  backend_ts:
    build:
      context: ./backend_ts
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # URL de la DB apuntando al servicio `postgres` de esta misma compose.
      # Dentro de la red de Docker, el hostname es el nombre del servicio.
      DATABASE_URL: postgresql://turnos:turnos@postgres:5432/turnosdb
      PORT: "3000"
      CORS_ORIGINS: "http://localhost:4200"
      # Credenciales de Gmail (opcionales: sin ellas no se envian emails)
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    depends_on:
      postgres:
        # Espera a que Postgres este listo antes de arrancar (sino migrate falla)
        condition: service_healthy
    volumes:
      # Archivos subidos (documentos de turnos)
      - uploads-data:/app/uploads
    networks:
      - backend-net

  # -------------------------------------------
  # Frontend (Angular + Nginx)
  # -------------------------------------------
  # Nginx sirve los archivos estaticos y hace proxy de /api y /uploads
  # hacia el backend.
  # -------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend_ts
    networks:
      - backend-net

# =============================================
# Named Volumes
# =============================================
volumes:
  # Datos de PostgreSQL — persisten entre reinicios
  postgres-data:
  # Archivos subidos (documentos de turnos)
  uploads-data:

# =============================================
# Networks
# =============================================
# Red bridge: los servicios se resuelven por nombre
# (ej: `postgres` y `backend_ts` son hostnames dentro de la red).
# =============================================
networks:
  backend-net:
    driver: bridge
